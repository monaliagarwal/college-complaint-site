<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollegeVoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="#">🎓 CollegeVoice</a>
  {% if user.is_authenticated %}
  <div class="d-flex align-items-center gap-3">
    {% if user.groups.all.0.name == 'Admin' %}
      <a href="{% url 'admin_dashboard' %}" class="text-white text-decoration-none">All Complaints</a>
    {% else %}
      <a href="{% url 'student_dashboard' %}" class="text-white text-decoration-none">Dashboard</a>
      <a href="{% url 'submit_complaint' %}" class="text-white text-decoration-none">Submit</a>
    {% endif %}
    <span class="text-secondary">|</span>
    <span class="text-white">{{ user.username }}</span>
    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
  </div>
  {% endif %}
</nav>
<div class="container mt-4">
  {% for message in messages %}
    <div class="alert alert-info">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
