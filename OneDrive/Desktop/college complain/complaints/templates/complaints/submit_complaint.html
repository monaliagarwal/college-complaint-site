{% extends 'complaints/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm p-4">
      <h4 class="mb-1">Submit a Complaint</h4>
      <p class="text-muted mb-4">Your complaint will be reviewed and prioritized automatically.</p>
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Title</label>
          {{ form.title }}
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Category</label>
          {{ form.category }}
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Description</label>
          {{ form.description }}
        </div>
        <button type="submit" class="btn btn-dark w-100">Submit Complaint</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
